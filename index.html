<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Imposter</title>
  <meta name="description" content="A pass-the-phone party game. Everyone gets the same word — except the imposter.">
  <meta name="theme-color" id="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Imposter">
  <meta name="application-name" content="Imposter">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/icon-180.png" sizes="180x180">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Non-blocking font: a slow network must never hold the first paint. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Apply saved theme before paint to avoid a flash; match the browser chrome colour.
    try {
      var t = JSON.parse(localStorage.getItem('imposter.v1') || '{}').theme;
      if (t) document.documentElement.setAttribute('data-theme', t);
      var dark = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.getElementById('theme-color').setAttribute('content', dark ? '#000000' : '#f5f5f7');
    } catch (e) {}
  </script>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="blob blob-a"></div>
    <div class="blob blob-b"></div>
    <div class="blob blob-c"></div>
  </div>

  <div class="app">
    <header class="topbar">
      <button class="icon-btn" id="btn-quit" aria-label="Leave game" hidden>
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
      <div class="topbar-title" id="topbar-title"></div>
      <button class="icon-btn" id="btn-theme" aria-label="Switch theme">
        <svg class="i-sun" viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></g></svg>
        <svg class="i-moon" viewBox="0 0 24 24" width="20" height="20"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" fill="currentColor"/></svg>
      </button>
    </header>
    <main id="stage" class="stage"></main>
  </div>

  <div id="sheet-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="fx-layer" class="fx-layer" aria-hidden="true"></div>

  <script src="js/vendor/gsap.min.js"></script>
  <script src="js/words.js"></script>
  <script src="js/game.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/screens.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Last-resort fallback (plain ES5): if the game never drew a screen, offer a reload.
    setTimeout(function () {
      var stage = document.getElementById('stage');
      if (stage && !stage.firstElementChild) {
        stage.innerHTML = '<div style="padding:40px 8px;text-align:center"><h1 class="title">Could not start the game</h1>' +
          '<p class="lead" style="margin:16px 0 24px">Please reload, or open this link in Chrome or Safari.</p>' +
          '<button class="btn btn-primary" onclick="location.reload()">Reload</button></div>';
      }
    }, 4000);
  </script>
</body>
</html>
